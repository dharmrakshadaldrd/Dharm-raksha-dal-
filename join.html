<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Dharm Raksha Dal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<img src="logo.png" class="main-logo">
<h1>धर्म रक्षा दल</h1>
<p>सदस्यता आवेदन फॉर्म</p>
</header>

<section class="join-form">

<h2>धर्म रक्षा दल से जुड़ें</h2>

<form>

<label>पूरा नाम</label>
<input type="text" placeholder="पूरा नाम" required>

<label>पिता का नाम</label>
<input type="text" placeholder="पिता का नाम" required>

<label>मोबाइल नंबर</label>
<input type="tel" placeholder="मोबाइल नंबर" required>

<label>WhatsApp नंबर</label>
<input type="tel" placeholder="WhatsApp नंबर" required>

<label>Email (Optional)</label>
<input type="email" placeholder="Email">

<label>राज्य</label>
<input type="text" placeholder="राज्य">

<label>जिला</label>
<input type="text" placeholder="जिला">

<label>प्रखंड / Block</label>
<input type="text" placeholder="प्रखंड">

<label>गांव / शहर</label>
<input type="text" placeholder="गांव / शहर">

<label>उम्र</label>
<input type="number" placeholder="उम्र">

<label>शिक्षा</label>
<input type="text" placeholder="शिक्षा">

<label>रुचि</label>
<select>
<option>समाज सेवा</option>
<option>गौ सेवा</option>
<option>रक्तदान</option>
<option>पर्यावरण</option>
<option>अन्य</option>
</select>

<button type="submit">आवेदन जमा करें</button>

</form>

</section>

</body>
</html>
