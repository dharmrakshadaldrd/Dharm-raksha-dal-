<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Dharm Raksha Dal</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff6600;
color:white;
text-align:center;
padding:20px;
}

header img{
width:90px;
}

h2{
text-align:center;
margin-top:30px;
color:#ff6600;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.gallery img{
width:100%;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.gallery img:hover{
transform:scale(1.03);
}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>धर्म रक्षा दल</h1>
<p>सेवा • सुरक्षा • संस्कार</p>
</header>

<h2>संस्थापक - आदित्य कश्यप</h2>

<div class="gallery">
<img src="aditya1.jpg" onclick="show(this.src)">
</div>

<h2>सह-संस्थापक - मुरारी सिंह</h2>

<div class="gallery">
<img src="murari1.jpg" onclick="show(this.src)">
</div>

<h2>परशुराम जयंती</h2>

<div class="gallery">
<img src="parshuram1.jpg" onclick="show(this.src)">
<img src="parshuram2.jpg" onclick="show(this.src)">
</div>

<div class="lightbox" id="lightbox" onclick="hide()">
<img id="bigimg">
</div>

<script>
function show(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("bigimg").src=src;
}

function hide(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
